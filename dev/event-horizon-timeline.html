<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Event Horizon · Darkn1de timeline</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060b15;color:#e8f1f6;font:14px system-ui}header{height:72px;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #223044}h1{font-size:18px;margin:0 0 4px}small{color:#9bafbf}main{height:calc(100dvh - 235px);min-height:280px;position:relative}canvas{width:100%;height:100%;display:block}#scene{position:absolute;top:20px;left:24px;color:#9df4ef;letter-spacing:.1em;font-size:12px}footer{padding:16px 24px}button,select{font:inherit;background:#132435;color:#e8f1f6;border:1px solid #314b5e;border-radius:6px;padding:8px 12px;cursor:pointer}button:hover{border-color:#82e8e5}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8afff5;outline-offset:3px}#timeline{width:100%;accent-color:#8afff5;margin:14px 0}nav{display:flex;gap:7px;overflow-x:auto;padding-bottom:7px;white-space:nowrap}.controls{display:flex;gap:12px;align-items:center}output{font-variant-numeric:tabular-nums;font-size:20px;min-width:90px}label{display:flex;gap:7px;align-items:center}#note{margin-left:auto;color:#9bafbf;font-size:12px}@media(max-width:650px){header{padding:10px 14px}header small{display:none}footer{padding:12px}#note{display:none}main{height:calc(100dvh - 235px)}}
</style><header><div><h1>Event Horizon <span style="color:#8afff5">/ Darkn1de</span></h1><small>Visual rehearsal · staged flight, real game renderer · no scores submitted</small></div><label>Season <select id="season"><option value="classic">Classic</option><option value="halloween">Halloween</option><option value="thanksgiving">Thanksgiving</option><option value="christmas">Christmas</option></select></label><label><input id="reduced" type="checkbox">Reduced motion</label></header>
<main><canvas id="space" aria-label="Event Horizon timeline preview"></canvas><div id="scene"></div></main><footer>
<div class="controls"><button id="play">Play</button><output id="clock">0:00.0</output><label>Speed <select id="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><span id="note">Drag to scrub · arrow keys fine tune the timeline</span></div>
<input id="timeline" type="range" min="0" max="360" step="0.05" value="0" aria-label="Flight timeline in seconds">
<nav aria-label="Jump to a moment"></nav></footer><script type="module" src="./event-horizon-timeline.mjs"></script></html>
