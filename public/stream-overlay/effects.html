    // These carry no alert id, so moderation never holds them; the config's other alert settings all apply.
    function handle(p) {
      var e = p.event || {}, type = p.subscription.type, fire = window.AcosmicFX.fire;
      if (type === "channel.follow") return fire("follow", { user: e.user_name });
      // A gifted sub also arrives here once per recipient; the gift event below announces those.
      if (type === "channel.subscribe") return e.is_gift ? null : fire("sub", { user: e.user_name, tier: e.tier });
      if (type === "channel.subscription.message") return fire("resub", { user: e.user_name, tier: e.tier, value: e.cumulative_months, text: e.message && e.message.text });
      if (type === "channel.subscription.gift") return fire("gift", { user: e.is_anonymous ? "Anonymous" : e.user_name, tier: e.tier, value: e.total });
      if (type === "channel.cheer") return fire("cheer", { user: e.is_anonymous ? "Anonymous" : e.user_name, value: e.bits, text: e.message });
      if (type === "channel.raid") return fire("raid", { user: e.from_broadcaster_user_name, value: e.viewers });
      if (type === "channel.hype_train.begin") return fire("hypetrain", { value: e.level, text: "The hype train is leaving the station!" });
      if (type === "channel.hype_train.end") return fire("hypetrain", { value: e.level, text: "Final stop. Thanks for riding." });
      var reward = cfg.rewards && e.reward && cfg.rewards[e.reward.id];
      if (!reward) return;
      var isUpdate = /\.update$/.test(type);
      // Rewards that carry viewer text wait in the mod queue and fire once approved.
      if (reward.on === "fulfilled" ? !(isUpdate && e.status === "fulfilled") : isUpdate) return;
      fire(reward.effect, { user: e.user_name, text: e.user_input });
    }
    function connect(url) {
      var sock = new WebSocket(url || "wss://eventsub.wss.twitch.tv/ws"), timer, quiet = 40000;
      function arm() { clearTimeout(timer); timer = setTimeout(function () { try { sock.close(); } catch (e) {} }, quiet); }
      arm();
      sock.onmessage = function (ev) {
        arm();
        var m = JSON.parse(ev.data), meta = m.metadata || {}, t = meta.message_type;
        if (seen.indexOf(meta.message_id) >= 0) return;
        seen.push(meta.message_id); if (seen.length > 300) seen.shift();
        if (t === "session_welcome") {
          backoff = 2000;
          quiet = (m.payload.session.keepalive_timeout_seconds + 15) * 1000; arm();
          var old = ws; ws = sock;
          if (old && old !== sock) { old.onclose = null; try { old.close(); } catch (e) {} }
          if (!url) subscribe(m.payload.session.id).catch(function (err) { setStatus("could not subscribe: " + err.message + " (run tools/twitch-setup.mjs again)"); });
        } else if (t === "session_reconnect") connect(m.payload.session.reconnect_url);
        else if (t === "notification") handle(m.payload);
        else if (t === "revocation") setStatus("Twitch revoked access (run tools/twitch-setup.mjs again)");
      };
      sock.onclose = function () {
        clearTimeout(timer);
        if (ws && ws !== sock) return; // a replacement connection is already live
        ws = null; setStatus("reconnecting");
        setTimeout(function () { connect(); }, backoff); backoff = Math.min(backoff * 2, 60000);
      };
    }
    setStatus("connecting");
    connect();
    setInterval(function () { refresh().catch(function (err) { setStatus("token refresh failed: " + err.message); }); }, 3 * 3600 * 1000);
  }

  // ---- Donation alerts ----------------------------------------------------------
  // Stripe tells the Acosmibot API about a donation; this page long-polls the API for it.
  // Runs only when alerts-config.js (written by tools/install-overlay.mjs, never committed) is present,
  // or in hosted mode, where the key from the link takes its place and every alert arrives this way.
  var alertStatus = "off (no alerts-config.js)";
  function setAlertStatus(s) { alertStatus = s; var el = document.getElementById("al"); if (el) el.textContent = "Alerts: " + s; }
  var ACFG = HOSTED || window.ACOSMIC_ALERTS_CONFIG;
  if (ACFG && ACFG.url && ACFG.key && !q.get("offline")) alertFeed(ACFG);

  function alertFeed(cfg) {
    var CKEY = "acosmic-fx-alert-cursor", STALE = 600, cursor = null, fails = 0, seenIds = [];
    var root = String(cfg.url).replace(/\/+$/, "") + "/api/stream-alerts/";
    // twitch=1 asks the API for the account's Twitch events as well. Hosted only: the installed copy listens to
    // Twitch itself (twitch() above) and would show every event twice.
    var base = root + "poll?wait=20" + (q.get("test") ? "&sandbox=1" : "") + (cfg.hosted ? "&twitch=1" : "");
    function readCursor() { try { cursor = localStorage.getItem(CKEY); } catch (e) {} }
    function req(signal) {
      var o = { headers: { Authorization: "Bearer " + cfg.key }, cache: "no-store", signal: signal };
      if (cfg.hosted) o.credentials = "omit";
      return o;
    }
    function failed(again, code, err) {
      fails++;
      // Hosted: the API answers 401 only when the link is no longer good (a new one was made, or the account
      // was turned off). Clear the stage and ask again once a minute.
      if (cfg.hosted && code === 401) { stopAll(); setAlertStatus("this OBS link no longer works (copy the current one from the dashboard)"); setTimeout(again, 60000); return; }
      setAlertStatus(code === 401 ? "wrong key (run tools/install-overlay.mjs --alerts-key)" : "retrying (" + (err && err.message || "network") + ")");
      setTimeout(again, code === 429 ? 45000 : Math.min(60000, 3000 * Math.pow(2, Math.min(fails, 5))));
    }
    // Hosted only: ask the API whose overlay this is before the first poll. Each account keeps its own cursor.
    function hello() {
      var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 15000), code = 0;
      fetch(root + "overlay/config", req(ctl.signal))
        .then(function (r) { code = r.status; return r.json(); })
        .then(function (j) {
          if (!j || !j.success) throw new Error((j && j.error) || "request failed " + code);
          fails = 0;
          CKEY = "acosmic-fx-alert-cursor" + (typeof j.account_id === "number" ? ":a" + j.account_id : "");
          readCursor();
          if (j.settings) applySettings(j.settings);
          // The account's alert settings and looks: give their media a little time to load so the first alerts use them.
          timeout(applyConfig(configOf(j)), 15000).catch(function () {}).then(poll);
        })
        .catch(function (err) { failed(hello, code, err); })
        .finally(function () { clearTimeout(timer); });
    }
    function configOf(j) { var c = j && j.config; return c && typeof c === "object" ? c : {}; }
    // A "config" control (alert settings or a look were saved on the dashboard): fetch the config again. Calls that
    // arrive while one is running are folded into one more fetch after it. The installed copy (local mode) also
    // fetches it once at start, with its own key, before the first poll.
    var cfgBusy = false, cfgAgain = false, cfgTries = 0;
    function reloadConfig() {
      if (cfgBusy) { cfgAgain = true; return Promise.resolve(); }
      cfgBusy = true; cfgAgain = false;
      var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 15000);
      return fetch(root + "overlay/config", req(ctl.signal))
        .then(function (r) { return r.json(); })
        .then(function (j) { clearTimeout(timer); if (!j || !j.success) throw new Error("config"); cfgTries = 0; return applyConfig(configOf(j)); })
        .catch(function () { if (++cfgTries <= 3) setTimeout(reloadConfig, 5000 * cfgTries); })
        .finally(function () { clearTimeout(timer); cfgBusy = false; if (cfgAgain) reloadConfig(); });
    }
    function poll() {
      var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 35000), code = 0;
      fetch(base + (cursor ? "&cursor=" + encodeURIComponent(cursor) : ""), req(ctl.signal))
        .then(function (r) { code = r.status; return r.json(); })
        .then(function (j) {
          if (!j || !j.success) throw new Error((j && j.error) || "request failed " + code);
          fails = 0; setAlertStatus("listening");
          if (j.settings) applySettings(j.settings);
          if (j.cursor) { cursor = j.cursor; try { localStorage.setItem(CKEY, cursor); } catch (e) {} }
          (j.alerts || []).forEach(function (a) {
            if (seenIds.indexOf(a.id) >= 0) return;
            seenIds.push(a.id); if (seenIds.length > 200) seenIds.shift();
            // Something that happened while OBS was closed is not announced late.
            // Controls: skip, clear and stop effects only when fresh, so a stale one never eats a later alert.
            if (a.type === "control") {
              // Any age: fetching the config again is idempotent.
              if (a.action === "config") { reloadConfig(); return; }
              // Moderation decisions from the dashboard count for up to 10 minutes (as long as an alert can wait).
              if (a.action === "approve" || a.action === "block") { if (Date.now() / 1000 - (a.created || 0) <= 600) decide(a.alert_id, a.action); return; }
              if (Date.now() / 1000 - (a.created || 0) > 30) return;
              if (a.action === "skip") skipAlert(); else if (a.action === "clear") clearAlerts(); else if (a.action === "stop_effects") stopEffects();
              return;
            }
            // An effect the owner sent from the dashboard, or a channel point redemption the API received from Twitch
            // (it carries the reward's title): a live action, so only when fresh, and only a real effect.
            if (a.type === "effect") {
              if (Date.now() / 1000 - (a.created || 0) > 30) return;
              var fo = { user: a.name, text: a.message };
              if (a.reward) fo.reward = String(a.reward).slice(0, 60);
              if (FX[a.effect] && !ALERTS[a.effect]) window.AcosmicFX.fire(a.effect, fo);
              return;
            }
            if (Date.now() / 1000 - (a.created || 0) > STALE) return;
            if (!ALERTS[a.type]) return;
            // A Twitch event the API received (source "twitch") is fired the way handle() fires the page's own, through
            // the same queue: pause, Safe Mode, the smallest raid and cheer, follow merging and flood mode all apply.
            var text = a.message;
            if (a.source === "twitch" && a.type === "hypetrain" && !text) text = "The hype train is leaving the station!";
            // id and created: moderation; variation: a test that forces one of the kind's looks.
            window.AcosmicFX.fire(a.type, { user: a.name, text: text, amount: a.amount_display, value: a.value, tier: a.tier, test: a.test || a.sandbox,
              id: a.id, created: a.created, variation: a.variation, amount_minor: a.amount_minor });
          });
          setTimeout(poll, 250);
        })
        .catch(function (err) { failed(poll, code, err); })
        .finally(function () { clearTimeout(timer); });
    }
    setAlertStatus("connecting");
    if (cfg.hosted) hello(); else { readCursor(); timeout(reloadConfig(), 15000).catch(function () {}).then(poll); }
  }

  if (q.get("test")) {
    var bar = document.getElementById("test"); bar.style.display = "flex";
    Object.keys(FX).forEach(function (k) {
      var b = document.createElement("button"); b.textContent = k;
      b.onclick = function () { FX[k]({ user: "test_viewer", text: "streamer has been lost for 14 minutes and still refuses to open the map" }); };
      bar.appendChild(b);
    });
    var tw = document.createElement("span"); tw.id = "tw"; tw.textContent = "Twitch: " + status; bar.appendChild(tw);
    var ob = document.createElement("span"); ob.id = "ob"; ob.textContent = "OBS: " + obsStatus; bar.appendChild(ob);
    var al = document.createElement("span"); al.id = "al"; al.textContent = "Alerts: " + alertStatus; bar.appendChild(al);
  }
})();
</script>
</body>
</html>
